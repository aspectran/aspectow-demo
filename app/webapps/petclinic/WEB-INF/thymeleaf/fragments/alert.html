<html xmlns:th="https://www.thymeleaf.org">
<body>

<div th:if="${flashMap != null && flashMap['message']}" class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert" id="success-message">
    <i class="bi bi-check-circle-fill me-2 flex-shrink-0" aria-hidden="true"></i>
    <div th:text="${flashMap['message']}"></div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
<div th:if="${flashMap != null && flashMap['error']}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert" id="error-message">
    <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0" aria-hidden="true"></i>
    <div th:text="${flashMap['error']}"></div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<script th:if="${flashMap != null}">
    setTimeout(function () {
        ["success-message", "error-message"].forEach(function (id) {
            const el = document.getElementById(id);
            if (el) {
                const alert = bootstrap.Alert.getOrCreateInstance(el);
                alert.close();
            }
        });
    }, 3500);
</script>

</body>
</html>
