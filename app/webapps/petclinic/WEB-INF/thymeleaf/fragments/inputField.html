<html xmlns:th="https://www.thymeleaf.org">
<body>

  <form>
    <th:block th:fragment="input (type, label, name, value)">
      <div th:with="valid=${errors == null || !errors.containsKey(name)}" class="row mb-3">
        <label class="col-sm-3 col-form-label fw-semibold text-sm-end" th:for="${name}" th:text="${label}">Label</label>
        <div class="col-sm-9">
          <th:block th:switch="${type}">
            <input th:case="'text'" th:id="${name}" class="form-control" th:classappend="${!valid ? 'is-invalid' : ''}"
                   type="text" th:name="${name}" th:value="${value}"/>
            <input th:case="'date'" th:id="${name}" class="form-control" th:classappend="${!valid ? 'is-invalid' : ''}"
                   type="date" th:name="${name}" th:value="${value}"/>
          </th:block>
          <div th:if="${!valid}" class="invalid-feedback" th:text="${errors['__${name}__']}">Error</div>
        </div>
      </div>
    </th:block>
  </form>

</body>
</html>
