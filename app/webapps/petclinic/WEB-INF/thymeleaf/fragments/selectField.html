<html xmlns:th="https://www.thymeleaf.org">
<body>

<form>
    <th:block th:fragment="select (label, name, items, value)">
        <div th:with="valid=${errors == null || !errors.containsKey(name)}" class="row mb-3">
            <label class="col-sm-3 col-form-label fw-semibold text-sm-end" th:for="${name}" th:text="${label}">Label</label>
            <div class="col-sm-9">
                <select th:id="${name}" th:name="${name}" class="form-select" th:classappend="${!valid ? 'is-invalid' : ''}">
                    <option th:each="item : ${items}" th:value="${item.id}"
                            th:text="${item.name}" th:selected="${item.id == value}">dog
                    </option>
                </select>
                <div th:if="${!valid}" class="invalid-feedback" th:text="${errors['__${name}__']}">Error</div>
            </div>
        </div>
    </th:block>
</form>

</body>
</html>
