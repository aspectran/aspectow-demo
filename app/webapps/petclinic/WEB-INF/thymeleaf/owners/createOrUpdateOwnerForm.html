<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, 'owners')}">

<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <th:block th:insert="~{fragments/alert}" />

            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h2 class="h4 mb-0">
                        <i class="bi me-2" th:classappend="${owner['new']} ? 'bi-person-plus' : 'bi-person-gear'" aria-hidden="true"></i>
                        <span th:text="${owner['new']} ? 'New Owner' : 'Edit Owner'">Owner</span>
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form id="add-owner-form" method="post">
                        <input th:replace="~{fragments/inputField :: input ('text', 'First Name', 'firstName', ${owner.firstName})}"/>
                        <input th:replace="~{fragments/inputField :: input ('text', 'Last Name', 'lastName', ${owner.lastName})}"/>
                        <input th:replace="~{fragments/inputField :: input ('text', 'Address', 'address', ${owner.address})}"/>
                        <input th:replace="~{fragments/inputField :: input ('text', 'City', 'city', ${owner.city})}"/>
                        <input th:replace="~{fragments/inputField :: input ('text', 'Telephone', 'telephone', ${owner.telephone})}"/>

                        <div class="row mt-4">
                            <div class="col-sm-9 offset-sm-3 d-flex gap-2">
                                <button th:with="text=${owner['new']} ? 'Add Owner' : 'Update Owner'"
                                        class="btn btn-primary" type="submit">
                                    <i class="bi bi-check-lg me-1" aria-hidden="true"></i><span th:text="${text}">Add Owner</span>
                                </button>
                                <button th:if="${!param.page}" type="button" class="btn btn-outline-secondary" onclick="history.back();">Cancel</button>
                                <a th:if="${param.page}" class="btn btn-outline-secondary" th:href="@{/owners(page=${param.page})}">Cancel</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
