<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, 'owners')}">

<th:block th:fragment="content">
    <th:block th:insert="~{fragments/alert}" />

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2 class="h3 mb-0">
            <i class="bi bi-people me-2" aria-hidden="true"></i>Owners
            <span class="badge bg-secondary-subtle text-body-secondary fs-6 ms-2 fw-normal">Total: <span th:text="${pageInfo.totalElements}">0</span></span>
        </h2>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/owners/find}">
                <i class="bi bi-search me-1" aria-hidden="true"></i>Find Owners
            </a>
            <a class="btn btn-success btn-sm" th:href="@{/owners/new(page=${param.page} ?: '1')}">
                <i class="bi bi-person-plus me-1" aria-hidden="true"></i>Add Owner
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table id="owners" class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th style="min-width: 160px;">Name</th>
                <th style="min-width: 200px;">Address</th>
                <th>City</th>
                <th style="min-width: 130px;">Telephone</th>
                <th>Pets</th>
            </tr>
            </thead>
            <tbody class="table-group-divider">
            <tr th:each="owner : ${listOwners}">
                <td>
                    <a class="fw-semibold text-decoration-none"
                       th:href="@{/owners/__${owner.id}__(page=${param.page} ?: '1')}"
                       th:text="${owner.firstName + ' ' + owner.lastName}"></a>
                </td>
                <td th:text="${owner.address}"></td>
                <td th:text="${owner.city}"></td>
                <td class="font-monospace" th:text="${owner.telephone}"></td>
                <td>
                    <span th:if="${!owner.pets.isEmpty()}" th:each="pet : ${owner.pets}"
                          class="badge bg-info-subtle text-info-emphasis border border-info-subtle me-1"
                          th:text="${pet.name}"></span>
                    <span th:if="${owner.pets.isEmpty()}" class="text-body-secondary fst-italic">none</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <th:block th:insert="~{fragments/pagination :: pagination(${pageInfo})}" />
</th:block>

</html>
