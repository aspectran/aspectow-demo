<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, 'owners')}">

<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <th:block th:insert="~{fragments/alert}" />

            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <h2 class="h4 mb-0">
                        <i class="bi bi-heart me-2" aria-hidden="true"></i>
                        <span th:text="${pet['new']} ? 'New Pet' : 'Edit Pet'">Pet</span>
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        <input th:if="${pet.id != null}" type="hidden" name="id" th:value="${pet.id}"/>
                        <div class="row mb-3">
                            <label class="col-sm-3 col-form-label fw-semibold text-sm-end">Owner</label>
                            <div class="col-sm-9">
                                <span class="form-control-plaintext fw-bold" th:text="${owner.firstName + ' ' + owner.lastName}"></span>
                            </div>
                        </div>
                        <input th:replace="~{fragments/inputField :: input ('text', 'Name', 'name', ${pet.name})}"/>
                        <input th:replace="~{fragments/inputField :: input ('date', 'Birth Date', 'birthDate', ${pet.birthDate})}"/>
                        <input th:replace="~{fragments/selectField :: select ('Type', 'typeId', ${types}, ${pet.type?.id})}"/>

                        <div class="row mt-4">
                            <div class="col-sm-9 offset-sm-3 d-flex gap-2">
                                <button th:with="text=${pet['new']} ? 'Add Pet' : 'Update Pet'"
                                        class="btn btn-primary" type="submit">
                                    <i class="bi bi-check-lg me-1" aria-hidden="true"></i><span th:text="${text}">Add Pet</span>
                                </button>
                                <button class="btn btn-outline-secondary" type="button" onclick="history.back();">Cancel</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
