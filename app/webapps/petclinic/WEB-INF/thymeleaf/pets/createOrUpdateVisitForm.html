<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, 'owners')}">

<th:block th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <th:block th:insert="~{fragments/alert}" />

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h3 mb-0">
                    <i class="bi bi-calendar-plus me-2" aria-hidden="true"></i>
                    <span th:text="${visit['new']} ? 'New Visit' : 'Visit'">Visit</span>
                </h2>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header py-2">
                    <h3 class="h6 mb-0 text-body-secondary">Pet Details</h3>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Birth Date</th>
                            <th>Type</th>
                            <th>Owner</th>
                        </tr>
                        </thead>
                        <tbody class="table-group-divider">
                        <tr>
                            <td class="fw-semibold" th:text="${pet.name}"></td>
                            <td class="font-monospace" th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
                            <td>
                                <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle" th:text="${pet.type}"></span>
                            </td>
                            <td th:text="${owner.firstName + ' ' + owner.lastName}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-header py-3">
                    <h3 class="h5 mb-0">Visit Information</h3>
                </div>
                <div class="card-body p-4">
                    <form method="post">
                        <input th:replace="~{fragments/inputField :: input ('date', 'Date', 'date', ${visit.date})}"/>
                        <input th:replace="~{fragments/inputField :: input ('text', 'Description', 'description', ${visit.description})}"/>

                        <div class="row mt-4">
                            <div class="col-sm-9 offset-sm-3 d-flex gap-2">
                                <input type="hidden" name="petId" th:value="${pet.id}"/>
                                <button class="btn btn-primary" type="submit">
                                    <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Add Visit
                                </button>
                                <button class="btn btn-outline-secondary" type="button" onclick="history.back();">Cancel</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <h3 class="h6 mb-0 text-body-secondary">Previous Visits</h3>
                    <span class="badge bg-secondary-subtle text-body-secondary" th:text="${pet.visits.size()}">0</span>
                </div>
                <div th:if="${!pet.visits.isEmpty()}" class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <colgroup>
                            <col style="width: 150px;">
                            <col>
                        </colgroup>
                        <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                        </tr>
                        </thead>
                        <tbody class="table-group-divider">
                        <tr th:each="v : ${pet.visits}" th:if="${!v['new']}">
                            <td class="font-monospace text-nowrap" th:text="${#temporals.format(v.date, 'yyyy-MM-dd')}"></td>
                            <td th:text="${v.description}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${pet.visits.isEmpty()}" class="card-body text-body-secondary small fst-italic">
                    No previous visits recorded for this pet.
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
