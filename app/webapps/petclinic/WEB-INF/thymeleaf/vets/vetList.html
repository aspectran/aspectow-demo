<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, 'vets')}">

<th:block th:fragment="content">
    <th:block th:insert="~{fragments/alert}" />

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2 class="h3 mb-0">
            <i class="bi bi-heart-pulse me-2" aria-hidden="true"></i>Veterinarians
            <span class="badge bg-secondary-subtle text-body-secondary fs-6 ms-2 fw-normal">Total: <span th:text="${pageInfo.totalElements}">0</span></span>
        </h2>
        <div>
            <a class="btn btn-success btn-sm" th:href="@{/vets/new(page=${param.page} ?: '1', specialtyId=${param.specialtyId})}">
                <i class="bi bi-person-plus me-1" aria-hidden="true"></i>Add Veterinarian
            </a>
        </div>
    </div>

    <!-- Specialty Filter Buttons -->
    <div class="d-flex flex-wrap align-items-center gap-1 mb-3">
        <span class="text-body-secondary small me-2"><i class="bi bi-funnel me-1" aria-hidden="true"></i>Specialty:</span>
        <a class="btn btn-sm rounded-pill"
           th:classappend="${selectedSpecialtyId == null} ? 'btn-primary' : 'btn-outline-secondary'"
           th:href="@{/vets.html}">All</a>
        <a th:each="spec : ${specialties}"
           class="btn btn-sm rounded-pill"
           th:classappend="${selectedSpecialtyId != null and selectedSpecialtyId == spec.id} ? 'btn-primary' : 'btn-outline-secondary'"
           th:href="@{/vets.html(specialtyId=${spec.id})}"
           th:text="${spec.name}">Specialty</a>
    </div>

    <div class="table-responsive">
        <table id="vets" class="table table-striped table-hover align-middle">
            <colgroup>
                <col style="width: 30%;">
                <col>
                <col style="width: 170px;">
            </colgroup>
            <thead>
            <tr>
                <th>Name</th>
                <th>Specialties</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody class="table-group-divider">
            <tr th:if="${#lists.isEmpty(listVets)}">
                <td colspan="3" class="text-center py-4 text-body-secondary">
                    <i class="bi bi-info-circle me-1" aria-hidden="true"></i>No veterinarians found.
                </td>
            </tr>
            <tr th:each="vet : ${listVets}">
                <td>
                    <a class="fw-semibold text-decoration-none"
                       th:href="@{/vets/__${vet.id}__/edit(page=${param.page} ?: '1', specialtyId=${param.specialtyId})}"
                       th:text="${vet.firstName + ' ' + vet.lastName}"></a>
                </td>
                <td>
                    <span th:each="specialty : ${vet.specialties}"
                          class="badge bg-success-subtle text-success-emphasis border border-success-subtle me-1"
                          th:text="${specialty.name}"></span>
                    <span th:if="${vet.nrOfSpecialties == 0}" class="text-body-secondary fst-italic">none</span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/vets/__${vet.id}__/edit(page=${param.page} ?: '1', specialtyId=${param.specialtyId})}"
                       title="Edit Veterinarian">
                        <i class="bi bi-pencil" aria-hidden="true"></i> Edit
                    </a>
                    <form th:action="@{/vets/__${vet.id}__/delete(page=${param.page} ?: '1', specialtyId=${param.specialtyId})}"
                          method="post" class="d-inline"
                          onsubmit="return confirm('Are you sure you want to delete this veterinarian?');">
                        <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete Veterinarian">
                            <i class="bi bi-trash" aria-hidden="true"></i> Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <th:block th:insert="~{fragments/pagination :: pagination(${pageInfo})}" />
</th:block>

</html>
