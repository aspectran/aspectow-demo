<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, 'home')}">

<th:block th:fragment="content">
    <div class="card shadow-sm border-0 px-3 py-2 mb-4 bg-body-secondary">
        <h2 class="h3 mb-0"><i class="bi bi-chat-heart me-2" aria-hidden="true"></i><span th:text="#{welcome}">Welcome</span></h2>
    </div>

    <div class="row g-4 align-items-center">
        <div class="col-md-6 text-center">
            <img class="img-fluid" th:src="@{/images/pets.png}" alt="Pets"/>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="row g-3 align-items-center">
                        <div class="col-sm-auto text-center">
                            <a href="https://jpetstore.aspectran.com/" title="Buy pets online from our pet store.">
                                <img src="https://jpetstore.aspectran.com/images/splash.gif" height="160" class="rounded bg-white p-2" alt="JPetStore Demo"/>
                            </a>
                        </div>
                        <div class="col">
                            <h3 class="h5 card-title">
                                <a href="https://jpetstore.aspectran.com/" class="text-decoration-none" title="Buy pets online from our pet store.">JPetStore Demo</a>
                            </h3>
                            <p class="card-text text-body-secondary mb-0">
                                Buy pets online from our pet store. Of course, it's just for demonstration purposes.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

</html>
